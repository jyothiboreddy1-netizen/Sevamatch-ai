version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - DATABASE_NAME=sevamatch
      - JWT_SECRET=sevamatch-ai-super-secret-production-grade-key-2026-xyz
      - FRONTEND_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      - mongodb

volumes:
  mongo_data:

